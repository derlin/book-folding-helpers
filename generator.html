<!doctype html>
<html>
    <head>
        <title>Book Folding Pattern Generator</title>
        <style>
            body {
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px;
                row-gap: 20px;
            }
            .controls {
                background: white;
                padding: 15px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            fieldset {
                margin-top: 20px;
                border-radius: 8px;
                border: 1px solid #afafaf;
            }
            .form-row {
                margin: 5px;
            }
            canvas {
                background: white;
                max-width: calc(100% - 1em);
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                display: none;
            }
            .buttons {
                text-align: center;
                margin-top: 10px;
                padding: 5px;
            }
            .buttons button {
                margin: 5px;
            }

            /* info display */
            #info-display {
                display: flex;
                justify-content: space-around;
                align-items: center;
                gap: 20px;
                flex-wrap: wrap;
            }

            #info-display > div {
                background-color: #fff;
                padding: 10px 20px;
                border-radius: 6px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                min-width: 150px;
                text-align: center;
                line-height: 1.6;
            }

            .highlight {
                font-weight: 500;
                color: #007bff;
                font-size: 1.1em;
            }

            /* Style the parameter line to ensure it's readable */
            #info-display > div:last-child {
                font-size: 0.9em;
                color: #666;
                font-family: monospace;
            }
        </style>
    </head>
    <body>
        <h1>Book Folding Pattern Generator</h1>

        <div class="controls">
            <div class="form-row">
                <label for="image-upload">Upload Image:</label>
                <input type="file" id="image-upload" accept="image/*" />
            </div>
            <div class="params">
                <fieldset class="input-group">
                    <legend>Input</legend>
                    <div class="form-row">
                        <label for="line-spacing">Stripes Spacing (px):</label>
                        <input
                            type="number"
                            id="line-spacing"
                            min="1"
                            max="100"
                            value="8"
                        />
                    </div>
                </fieldset>
                <fieldset class="input-group">
                    <legend>Output</legend>
                    <div class="form-row">
                        <label for="line-thickness">Line Thickness (px):</label>
                        <input
                            type="number"
                            id="line-thickness"
                            min="1"
                            max="10"
                            value="2"
                        />
                    </div>
                    <div class="form-row">
                        <label for="horizontal-spacing"
                            >Horizontal Spacing (Multiplier):</label
                        >
                        <input
                            type="number"
                            id="horizontal-spacing"
                            min="1"
                            max="10"
                            value="1"
                            step="0.1"
                        />
                    </div>
                    <div class="form-row">
                        <label for="padding">Padding (px):</label>
                        <input
                            type="number"
                            id="padding"
                            min="1"
                            max="100"
                            value="10"
                        />
                    </div>
                    <div class="form-row checkbox-row">
                        <input
                            type="checkbox"
                            id="helper-lines"
                            checked="checked"
                        />
                        <label for="helper-lines">Draw helper lines</label>
                    </div>
                </fieldset>
            </div>
            <div class="buttons">
                <button id="generate-btn">Generate Pattern</button>
                <button id="download-btn">Download as PNG</button>
            </div>
            <a id="download-link" style="display: none"></a>
        </div>

        <div id="info-display">Upload an image to get started!</div>

        <canvas id="preview-canvas"></canvas>

        <script>
            const imageUpload = document.getElementById("image-upload");
            const lineSpacingInput = document.getElementById("line-spacing");
            const horizontalSpacingInput =
                document.getElementById("horizontal-spacing");
            const lineThicknessInput =
                document.getElementById("line-thickness");
            const paddingInput = document.getElementById("padding");
            const helperLinesCheckbox = document.getElementById("helper-lines");
            const generateBtn = document.getElementById("generate-btn");
            const downloadBtn = document.getElementById("download-btn");
            const downloadLink = document.getElementById("download-link");
            const infoDisplay = document.getElementById("info-display");
            const canvas = document.getElementById("preview-canvas");
            const ctx = canvas.getContext("2d");

            let originalImage = null;
            let data = null;
            let boundaries = null; // [[x_min, x_max], [y_min, y_max]]
            let padding = null;

            imageUpload.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            originalImage = img;
                            loadImage();
                            generatePattern();
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.querySelectorAll("div.params input").forEach((input) => {
                input.addEventListener("change", (event) => {
                    if (originalImage) generatePattern();
                });
            });
            generateBtn.addEventListener("click", generatePattern);
            downloadBtn.addEventListener("click", downloadAsPNG);

            function generatePattern() {
                if (!originalImage) {
                    alert("Please upload an image first.");
                    return;
                }

                const lineSpacing = parseInt(lineSpacingInput.value);
                const horizontalSpacing = parseFloat(
                    horizontalSpacingInput.value,
                );
                const lineThickness = parseInt(lineThicknessInput.value);
                const padding = parseInt(paddingInput.value);
                const helperLines = helperLinesCheckbox.checked;

                let pageNumber = 1;
                let linesCount = 0;
                let segmentsCount = 0;

                // Set final canvas dimensions based on new spacing
                canvas.width =
                    boundaries[0][1] * horizontalSpacing -
                    boundaries[0][0] +
                    padding * 2;
                canvas.height =
                    boundaries[1][1] - boundaries[1][0] + padding * 2;

                // white bg
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (
                    let x = boundaries[0][0];
                    x <= boundaries[0][1];
                    x += lineSpacing
                ) {
                    let startY = -1;
                    const segments = [];
                    for (let y = 0; y < originalImage.height; y++) {
                        const pixelIndex = (y * originalImage.width + x) * 4;
                        const isDark = data[pixelIndex] < 128;

                        if (isDark) {
                            if (startY === -1) {
                                startY = y;
                            }
                        } else {
                            if (startY !== -1) {
                                segments.push({ start: startY, end: y - 1 });
                                startY = -1;
                            }
                        }
                    }

                    if (startY !== -1) {
                        segments.push({
                            start: startY,
                            end: originalImage.height - 1,
                        });
                    }

                    const newX =
                        Math.round((x - boundaries[0][0]) * horizontalSpacing) +
                        padding;

                    if (helperLines && linesCount % 2 == 0) {
                        ctx.beginPath();
                        ctx.moveTo(newX, 0);
                        ctx.lineTo(newX, canvas.height);
                        ctx.lineWidth = 1;
                        ctx.strokeStyle =
                            linesCount % 10 == 0 ? "#ff0000" : "#c8c8c8";
                        ctx.stroke();
                    }
                    linesCount += 1;

                    const yShift = padding - boundaries[1][0];
                    if (segments.length > 0) {
                        segments.forEach((seg) => {
                            ctx.beginPath();
                            ctx.moveTo(newX, seg.start + yShift);
                            if (seg.start == seg.end) {
                                // 1px, so make it show
                                ctx.lineTo(
                                    newX,
                                    seg.start + lineThickness + yShift,
                                );
                            } else {
                                ctx.lineTo(newX, seg.end + yShift);
                            }
                            ctx.lineWidth = lineThickness;
                            ctx.strokeStyle = "black";
                            ctx.stroke();

                            pageNumber += 2;
                            segmentsCount++;
                        });
                    }
                }

                canvas.style.display = "block";
                infoDisplay.innerHTML = `
                  <div>
                   Lines: <span class="highlight">${linesCount}</span>
                   → <span class="highlight">${linesCount * 2}</span> pages
                  </div>
                  <div>
                   Segments: <span class="highlight">${segmentsCount}</span>
                   → <span class="highlight">${pageNumber - 1}</span> pages
                  </div>
                  <div>
                   Params: stripes=${lineSpacing} thickness=${lineThickness} spacing=${lineSpacing}
                  </div>`;
            }

            function loadImage() {
                if (!originalImage) return;

                // Temporary canvas for pixel data
                const tempCanvas = document.createElement("canvas");
                const tempCtx = tempCanvas.getContext("2d");
                tempCanvas.width = originalImage.width;
                tempCanvas.height = originalImage.height;
                tempCtx.drawImage(originalImage, 0, 0);

                const tempImageData = tempCtx.getImageData(
                    0,
                    0,
                    tempCanvas.width,
                    tempCanvas.height,
                );
                const tempData = tempImageData.data;
                for (let i = 0; i < tempData.length; i += 4) {
                    const avg =
                        (tempData[i] + tempData[i + 1] + tempData[i + 2]) / 3;
                    const color = avg > 128 ? 255 : 0;
                    tempData[i] = tempData[i + 1] = tempData[i + 2] = color;
                }
                tempCtx.putImageData(tempImageData, 0, 0);

                const finalImageData = tempCtx.getImageData(
                    0,
                    0,
                    tempCanvas.width,
                    tempCanvas.height,
                );
                data = finalImageData.data;

                boundaries = [
                    [0, 0], // x0, x1
                    [originalImage.height, 0], // y0, y1
                ];

                for (let x = 0; x < originalImage.width; x++) {
                    for (let y = 0; y < originalImage.height; y++) {
                        const pixelIndex = (y * originalImage.width + x) * 4;
                        const isDark = data[pixelIndex] < 128;

                        if (isDark) {
                            if (boundaries[0][0] == 0) boundaries[0][0] = x;
                            boundaries[0][1] = x;
                            boundaries[1][0] = Math.min(y, boundaries[1][0]);
                            boundaries[1][1] = Math.max(y, boundaries[1][1]);
                        }
                    }
                }
                console.log("Boundaries", boundaries);
            }

            function downloadAsPNG() {
                if (!originalImage) {
                    alert("Please upload an image first.");
                    return;
                }
                const dataURL = canvas.toDataURL("image/png");
                downloadLink.href = dataURL;
                downloadLink.download = "book_folding_pattern.png";
                downloadLink.click();
            }
        </script>
    </body>
</html>
